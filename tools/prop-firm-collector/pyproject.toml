[project]
name = "fundedflow-collector"
version = "0.1.0"
description = "FundedFlow Build 29: prop-firm source registry and safe public page collector (unverified evidence only)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary. See LICENSE at the repository root." }
authors = [{ name = "Kyle Shabaga" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.8",
    "jsonschema>=4.23",
    # Exact pins: net/pinned_backend.py implements httpcore's network backend interface.
    "httpx==0.28.1",
    "httpcore==1.0.9",
    "brotli>=1.1",
    "protego>=0.4",
    "defusedxml>=0.7.1",
    "lxml>=5.3",
    "trafilatura>=2.0",
    "beautifulsoup4>=4.12",
    "pypdf>=6.1",
    "psutil>=6.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.48"]

[project.scripts]
collector = "fundedflow_collector.cli.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-socket>=0.7",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "types-psutil",
    "types-defusedxml",
    "types-jsonschema",
    "lxml-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundedflow_collector"]

[tool.uv]
required-version = ">=0.5"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "TID", "SIM", "RUF", "PT"]
ignore = [
    "S101",   # assert is fine in tests and for type narrowing
    "S603",   # subprocess with a fixed argument list (PDF worker)
    "RUF001", "RUF002", "RUF003",  # typographic characters in text and docs are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S310", "S311"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"trafilatura.fetch_url".msg = "All network I/O goes through fundedflow_collector.net.client."
"trafilatura.downloads".msg = "All network I/O goes through fundedflow_collector.net.client."
"urllib.request".msg = "All network I/O goes through fundedflow_collector.net.client."
"requests".msg = "All network I/O goes through fundedflow_collector.net.client."

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["fundedflow_collector"]

[[tool.mypy.overrides]]
module = ["trafilatura.*", "protego.*", "playwright.*", "brotli.*", "pytest_socket.*", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--disable-socket --allow-unix-socket -p no:cacheprovider"
markers = [
    "browser: needs the [browser] extra and Playwright Chromium",
    "loopback: opens a real socket on 127.0.0.1",
]
