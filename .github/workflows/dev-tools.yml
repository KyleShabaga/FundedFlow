name: Developer tools

on:
  pull_request:
    paths:
      - 'scripts/reset-test-data*.mjs'
      - 'scripts/dev-*.mjs'
      - '.github/workflows/dev-tools.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/reset-test-data*.mjs'
      - 'scripts/dev-*.mjs'
      - '.github/workflows/dev-tools.yml'

jobs:
  reset-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test scripts/reset-test-data.test.mjs scripts/dev-reset-handoff.test.mjs
