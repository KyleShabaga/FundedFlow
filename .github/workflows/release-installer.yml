name: Release installer

# Build 26.75 / NA-2: builds the unsigned NSIS installer and uploads it with its SHA-256 as a workflow artifact.
# Nothing is published: no GitHub release, no secrets, no signing, no updater (owner decision 2026-10-21).
# Pull requests that touch bundler inputs get a test build; their artifact is kept for 3 days, tag and manual runs 30.
# TASK-027: every check in checks.yml runs first in this same run, on the exact commit that is packaged; the installer
# is built only when all of them pass.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      # Bundler inputs: the Tauri crate (Cargo.toml/lock, icons, capabilities, migrations, Rust sources), the
      # frontend build that beforeBuildCommand runs, the dependency manifests and the dev-tools check.
      # TASK-027 widened this (additively): all of apps/desktop (frontend sources and notices included), the domain
      # package the frontend bundles, and the shared checks workflow.
      - 'apps/desktop/**'
      - 'packages/**'
      - '.github/workflows/checks.yml'
      - 'apps/desktop/src-tauri/**'
      - 'apps/desktop/package.json'
      - 'apps/desktop/vite.config.ts'
      - 'apps/desktop/index.html'
      - 'apps/desktop/scripts/**'
      - 'LICENSE'
      - 'apps/desktop/THIRD_PARTY_NOTICES.txt'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release-installer.yml'

concurrency:
  group: release-installer-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: the job only checks out, builds and uploads a workflow artifact.
permissions:
  contents: read

jobs:
  # The same checks as CI (checks.yml), on the commit this run packages: a pull request's head commit, not GitHub's
  # merge commit. `with:` can't read `env`, so the SHA expression is repeated here and in SOURCE_SHA below.
  # Candidates (workflow_dispatch, v* tags) fail on an audit that did not run; pull-request test builds only warn.
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      expected-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      # Always true here: a job skipped by its own `if` would count as a success to `needs`.
      run-build-and-test: true
      fail-on-outage: ${{ github.event_name != 'pull_request' }}

  nsis-installer:
    # Default `if: success()`: failed, cancelled or timed-out checks skip packaging, so no artifact is uploaded.
    needs: [checks]
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      # A pull request builds its head commit, not GitHub's temporary merge commit, so the hash maps to a real SHA.
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Checked-out commit is SOURCE_SHA
        run: |
          $head = git rev-parse HEAD
          "Checked-out commit: ``$head``" >> $env:GITHUB_STEP_SUMMARY
          "Checked-out commit: $head"
          if ($head -ne $env:SOURCE_SHA) { throw "Checked out $head, expected $env:SOURCE_SHA" }

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # Clean install from the single root lockfile (no node_modules or dist cached).
      - name: Install dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Toolchain versions
        run: |
          $rustc = rustc --version
          $cargo = cargo --version
          $node = node --version
          $npm = npm --version
          $cli = (npm run --silent tauri -- --version | Select-Object -Last 1)
          "rustc: $rustc", "cargo: $cargo", "node: $node", "npm: $npm", "@tauri-apps/cli: $cli"
          "## Toolchain`n`n| | |`n|---|---|`n| rustc | ``$rustc`` |`n| cargo | ``$cargo`` |`n| node | ``$node`` |`n| npm | ``$npm`` |`n| @tauri-apps/cli | ``$cli`` |" >> $env:GITHUB_STEP_SUMMARY

      - name: Read app version
        id: meta
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if (-not $version) { throw "No version in tauri.conf.json" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match app version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "short_sha=$($env:SOURCE_SHA.Substring(0, 7))" >> $env:GITHUB_OUTPUT

      # beforeBuildCommand runs `npm run build`, whose build:app ends with scripts/check-no-dev-tools.mjs; a leak
      # fails it and therefore this step. The Rust dev commands are compiled only under debug_assertions.
      - name: Build NSIS installer (release)
        run: npm run tauri -- build

      # Belt and braces: re-run the dev-tools check on the exact frontend that was bundled. The script only checks
      # when run as the main module, so require its success line rather than trusting the exit code alone.
      - name: No developer tools in the bundled frontend
        run: |
          $out = node apps/desktop/scripts/check-no-dev-tools.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out
          if ($out -notcontains 'Production build contains no developer tools.') { throw 'Dev-tools check did not run' }

      - name: Locate installer and write SHA256SUMS.txt
        id: installer
        run: |
          $dir = 'apps/desktop/src-tauri/target/release/bundle/nsis'
          $exes = @(Get-ChildItem -Path $dir -Filter '*.exe' -File)
          if ($exes.Count -ne 1) { throw "Expected exactly one installer in $dir, found $($exes.Count)" }
          $exe = $exes[0]
          $hash = (Get-FileHash -Algorithm SHA256 -Path $exe.FullName).Hash.ToLowerInvariant()
          $sums = Join-Path $dir 'SHA256SUMS.txt'
          @(
            "# FundedFlow $env:VERSION unsigned NSIS installer"
            "# source_sha: $env:SOURCE_SHA"
            "# version: $env:VERSION"
            "$hash  $($exe.Name)"
          ) | Set-Content -Path $sums -Encoding utf8NoBOM
          Get-Content $sums
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "sums=$sums" >> $env:GITHUB_OUTPUT
          "## Installer`n`n| | |`n|---|---|`n| File | ``$($exe.Name)`` |`n| SHA-256 | ``$hash`` |`n| Source SHA | ``$env:SOURCE_SHA`` |`n| Version | $env:VERSION |" >> $env:GITHUB_STEP_SUMMARY
        env:
          VERSION: ${{ steps.meta.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: fundedflow-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short_sha }}-windows-nsis
          path: |
            ${{ steps.installer.outputs.path }}
            ${{ steps.installer.outputs.sums }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 30 }}
