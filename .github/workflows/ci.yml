name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Daily audit so new advisories surface without a code change (runs the dependency-audit job only).
  schedule:
    - cron: "17 6 * * *"
  # Manual run of both jobs; like the schedule, an audit that can't run fails it.
  workflow_dispatch:

# The event is part of the group so a scheduled or manual run on main never cancels a push run (or the reverse).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: the jobs only check out, build and test.
permissions:
  contents: read

jobs:
  # The checks themselves live in checks.yml (TASK-027), shared with the installer gate in release-installer.yml.
  # The default checkout is unchanged: GitHub's merge commit on pull_request, the pushed commit on main.
  # Check names read "checks / build-and-test" and "checks / dependency-audit".
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      ref: ''
      # The schedule runs the dependency audit only.
      run-build-and-test: ${{ github.event_name != 'schedule' }}
      # Outage rule: an audit with no result passes with a warning on pull_request and push, and fails on schedule
      # and workflow_dispatch, so an audit that never ran there is red.
      fail-on-outage: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
